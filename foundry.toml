[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

[etherscan]
mainnet  = { key = "${ETHERSCAN_API_KEY}", chain = 1,         url = "https://api.etherscan.io/v2/api?chainid=1" }
sepolia  = { key = "${ETHERSCAN_API_KEY}", chain = 11155111,  url = "https://api.etherscan.io/v2/api?chainid=11155111" }
gnosis   = { key = "${GNOSISSCAN_API}",   chain = 100,        url = "https://api.gnosisscan.io/api" }
polygon  = { key = "${POLYGONSCAN_API}",  chain = 137,        url = "https://api.polygonscan.com/api" }
unknown_chain = { key = "${LINEASCAN_API_KEY}", chain = 59141, url = "https://api-sepolia.lineascan.build/api" }
